services:
  - type: web
    name: insightengine-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: InsightEngine
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: MAX_CSV_ROWS
        value: "5000"
      - key: DATABASE_URL
        sync: false
