services:
  db:
    image: mysql:8.0
    container_name: insightengine_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insightengine}
      MYSQL_USER: ${MYSQL_USER:-insightuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-insightpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightengine_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: InsightEngine
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-insightuser}:${MYSQL_PASSWORD:-insightpass}@db:3306/${MYSQL_DATABASE:-insightengine}
      API_V1_PREFIX: /api/v1
      MAX_UPLOAD_SIZE_MB: 5
      MAX_CSV_ROWS: 5000
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local
